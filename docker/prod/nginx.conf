server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 32M;

    # Belt to the middleware's braces (App\Http\Middleware\SecurityHeaders):
    # these also cover the static files nginx serves without touching PHP.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Uploaded avatars, covers and share images. Two rules matter here:
    # nothing in this tree is ever executed (the regex location below would
    # otherwise happily run a .php file that got in), and a browser is told
    # in no uncertain terms to treat the bytes as the declared image type.
    # An image parsed as HTML is stored XSS on the same origin as the admin
    # session cookie.
    location ^~ /storage/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        location ~ \.(php|phar|phtml|php\d*)$ {
            deny all;
        }

        try_files $uri =404;
    }

    location ~ \.php$ {
        # Without this, PHP-FPM's default cgi.fix_pathinfo=1 walks a request
        # like /storage/avatars/photo.jpg/x.php backwards until it finds a
        # file that exists -- photo.jpg -- and executes it as PHP. Uploads
        # are user-supplied, and a JPEG can carry PHP in its comment field,
        # so that path is remote code execution. Refusing to hand PHP-FPM a
        # script that does not literally exist closes it.
        try_files $uri =404;

        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
