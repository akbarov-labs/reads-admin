name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Build once, then promote: every push to main becomes one image, which goes
# to staging automatically. Production gets it only when someone runs
# promote.yml ("Promote to production") by hand — this repository is
# private, and GitHub's free plan offers no Required reviewers for it.
# Production therefore always runs an image that already ran on staging —
# migrations included, since the container runs them on start.

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag and repo (lowercase — GHCR rejects mixed case)
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds the Laravel app inside Docker (see docker/prod/Dockerfile) —
      # this runs on GitHub's runner, not on the VPS, so the VPS's limited
      # RAM never comes into play.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}:latest
            ghcr.io/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-and-push
    uses: ./.github/workflows/deploy-to.yml
    permissions:
      packages: read
    with:
      environment: staging
      image_tag: ${{ needs.build-and-push.outputs.tag }}
    secrets: inherit
